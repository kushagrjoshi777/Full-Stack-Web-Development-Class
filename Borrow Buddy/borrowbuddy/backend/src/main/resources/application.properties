spring.application.name=borrowbuddy
server.port=${SERVER_PORT:8080}

# Loads backend/.env (KEY=VALUE) if present. See .env.example
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/borrowbuddy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.upload.dir=${UPLOAD_DIR:uploads}
app.seed.enabled=${SEED_ENABLED:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

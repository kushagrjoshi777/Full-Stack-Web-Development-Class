<!DOCTYPE html>
<head>
    <title>Online Banking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .balance-section {
            background-color: #e8f4f8;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .balance-label {
            color: #555;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .balance-amount {
            font-size: 32px;
            color: #27ae60;
            font-weight: bold;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .message {
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Online Banking System</h1>
        
        <div class="balance-section">
            <div class="balance-label">Current Balance</div>
            <div class="balance-amount" id="balance">$5000.00</div>
        </div>
        
        <div class="form-section">
            <h2>Deposit Money</h2>
            <div class="form-group">
                <label for="depositAmount">Amount:</label>
                <input type="number" id="depositAmount" placeholder="Enter amount" min="0" step="0.01">
            </div>
            <button onclick="deposit()">Deposit</button>
            <div class="message" id="depositMessage"></div>
        </div>
        
        <div class="form-section">
            <h2>Withdraw Money</h2>
            <div class="form-group">
                <label for="withdrawAmount">Amount:</label>
                <input type="number" id="withdrawAmount" placeholder="Enter amount" min="0" step="0.01">
            </div>
            <button onclick="withdraw()">Withdraw</button>
            <div class="message" id="withdrawMessage"></div>
        </div>
        
        <button onclick="showBalance()" style="background-color: #27ae60;">Show Balance</button>
    </div>
    
    <script>
        let balance = 5000.00;
        
        function showBalance() {
            document.getElementById('balance').textContent = '$' + balance.toFixed(2);
            alert('Your current balance is: $' + balance.toFixed(2));
        }
        





        
        function deposit() {
            const depositAmount = parseFloat(document.getElementById('depositAmount').value);
            const depositMessage = document.getElementById('depositMessage');
            
            if (isNaN(depositAmount) || depositAmount <= 0) {
                depositMessage.textContent = 'Please enter a valid amount';
                depositMessage.className = 'message error';
                depositMessage.style.display = 'block';
                return;
            }
            
            balance += depositAmount;
            document.getElementById('balance').textContent = '$' + balance.toFixed(2);
            depositMessage.textContent = 'Successfully deposited $' + depositAmount.toFixed(2);
            depositMessage.className = 'message success';
            depositMessage.style.display = 'block';
            document.getElementById('depositAmount').value = '';
        }
        
        function withdraw() {
            const withdrawAmount = parseFloat(document.getElementById('withdrawAmount').value);
            const withdrawMessage = document.getElementById('withdrawMessage');
            
            if (isNaN(withdrawAmount) || withdrawAmount <= 0) {
                withdrawMessage.textContent = 'Please enter a valid amount';
                withdrawMessage.className = 'message error';
                withdrawMessage.style.display = 'block';
                return;
            }
            
            if (withdrawAmount > balance) {
                withdrawMessage.textContent = 'Insufficient funds';
                withdrawMessage.className = 'message error';
                withdrawMessage.style.display = 'block';
                return;
            }
            
            balance -= withdrawAmount;
            document.getElementById('balance').textContent = '$' + balance.toFixed(2);
            withdrawMessage.textContent = 'Successfully withdrawn $' + withdrawAmount.toFixed(2);
            withdrawMessage.className = 'message success';
            withdrawMessage.style.display = 'block';
            document.getElementById('withdrawAmount').value = '';
        }
    </script>
</body>
</html>
